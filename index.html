<section class="auth-panel" id="account">
    <h2>Synchronisierung</h2>

    <div id="authControls">
        <p>Melde dich an, um deine Vokabeln auf allen Geräten zu synchronisieren.</p>

        <input type="email" id="authEmail" placeholder="E-Mail-Adresse">
        <input type="password" id="authPassword" placeholder="Passwort">

        <button onclick="signUp()">Konto erstellen</button>
        <button class="secondary" onclick="signIn()">Anmelden</button>
    </div>

    <p id="authStatus">Du bist nicht angemeldet.</p>

    <button
        id="signOutButton"
        class="secondary hidden"
        onclick="signOut()">
        Abmelden
    </button>
</section>
